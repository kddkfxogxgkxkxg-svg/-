<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاختبار الإلكتروني</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111326;color:#f5f6ff;font-family:Tahoma,Arial,sans-serif;line-height:1.8}
main{width:min(760px,92%);margin:30px auto}
header,.card{background:#1b1e29;border:1px solid #34394b;border-radius:16px;padding:22px;margin-bottom:16px}
header{border-top:4px solid #6b78ff}
h1{margin-top:0}
label{display:block;margin:12px 0 5px;font-weight:bold}
input{max-width:100%;font:inherit}
input[type="text"],input[type="number"]{width:100%;padding:12px;border:1px solid #34394b;border-radius:9px;background:#11141e;color:white}
.hint{color:#b7bdd0;font-size:13px;margin-top:4px;display:block}
.question{background:#151824;border:1px solid #34394b;border-radius:12px;padding:16px;margin:12px 0}
.choices{display:flex;gap:12px;margin-top:10px}
.choices label{flex:1;display:flex;align-items:center;gap:8px;border:1px solid #34394b;border-radius:9px;padding:10px;cursor:pointer;margin:0}
button{width:100%;padding:14px;background:#6b78ff;color:white;border:0;border-radius:10px;font:bold 16px Tahoma;cursor:pointer;transition:0.2s}
button:disabled{opacity:0.6;cursor:not-allowed}

/* تنسيقات صفحة التأكيد المدمجة */
#confirmation-view{display:none;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:20px}
.confirm-card{width:min(520px,100%);background:#1b1e29;border:1px solid #34394b;border-top:4px solid #6b78ff;border-radius:20px;padding:35px 22px}
.icon{font-size:60px}
.confirm-card h1{font-size:27px}
.confirm-card p{font-size:18px;line-height:2}
.small{color:#b7bdd0;font-size:14px}
.status-box{margin-top:18px;padding:14px;border-radius:12px;background:#151824;border:1px solid #34394b;font-size:15px}
</style>
</head>
<body>

<!-- الصفحة الأولى: الاختبار -->
<main id="quiz-view">
<header>
<h1>الاختبار الإلكتروني</h1>
<p>أكمل بياناتك وأجب عن جميع الأسئلة.</p>
</header>

<form id="quiz">
<section class="card">
<h2>البيانات الشخصية</h2>

<label for="gameUser">يوزرك باللعبة</label>
<input id="gameUser" name="gameUser" type="text" required>

<label for="realName">اسمك الحقيقي</label>
<input id="realName" name="realName" type="text" required>

<label for="age">عمرك الحقيقي</label>
<input id="age" name="age" type="number" min="1" max="120" required>

<label for="discordUser">يوزرك في الديسكورد (يفضل وضع الـ ID للمنشن)</label>
<input id="discordUser" name="discordUser" type="text" placeholder="مثال: 123456789012345678" required>
<span class="hint">إذا كتبت رقم الـ ID الخاص بحسابك في ديسكورد سيتم عمل منشن لك مباشرة.</span>
</section>

<section class="card">
<h2>أسئلة الاختبار</h2>
<div id="questions"></div>
</section>

<button type="submit" id="submitBtn">إرسال الإجابات</button>
</form>
</main>

<!-- الصفحة الثانية: شاشة التأكيد -->
<div id="confirmation-view">
<div class="confirm-card">
<div class="icon" id="confirm-icon">✅</div>
<h1 id="confirm-title">تم إرسال اختبارك إلى الإدارة</h1>
<p id="confirm-message">يرجى الانتظار حتى يتم الرد عليك من الإدارة.</p>
<div class="status-box" id="result-summary"></div>
<p class="small">شكرًا لك على إكمال الاختبار ❤️</p>
</div>
</div>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1573817844888506579/GEnIMN4yOgd1lu4bfcCJQRfKha0D4p8Y5HiJgL9qJIpyiVOvXiqkng9jDw2ILeebs-fu";

// الأسئلة والإجابة الصحيحة لكل سؤال (يمكنك تعديل الإجابات الصحيحة حسب قواعد سيرفرك)
const quizData = [
  { question: "هل يسمح لك قتل مسعف؟", correct: "خطأ" },
  { question: "هل يسمح لك إهانة الجثة؟", correct: "خطأ" },
  { question: "هل يسمح لك الاعتداء على البت (المدني)؟", correct: "خطأ" },
  { question: "هل يسمح لك أخذ معلومات من بث أو فيديو يوتيوب؟", correct: "خطأ" },
  { question: "لو شخص قيّدك بالكامل، هل تقدر تتكلم بالجوال وتطلب مساعدة؟", correct: "خطأ" },
  { question: "إن رأيت شخصًا يستعمل ثغرة، ما التصرف الصحيح تجاهه؟", correct: "صح" },
  { question: "هل يسمح لمجرم أو موظف ارتداء لبس عسكري (تمثيل/انتحال صفة)؟", correct: "خطأ" },
  { question: "في حال كنت في فايت وواجهك ثلاثة هددوك ورفعوا عليك السلاح وأنت ما معك سلاح، هل يحق لك تقاوم؟", correct: "خطأ" },
  { question: "هل يسمح استغلال خدمات الجوال مثل طلب تاكسي بهدف الخطف أو القتل؟", correct: "خطأ" },
  { question: "هل يسمح لك الكذب داخل الرول؟", correct: "صح" },
  { question: "هل يسمح لك مداهمة مقر عصابة أو مركز شرطة من دون إعلان؟", correct: "خطأ" }
];

const root = document.getElementById("questions");

quizData.forEach((item, index) => {
  const number = index + 1;
  const div = document.createElement("div");
  div.className = "question";

  const title = document.createElement("strong");
  title.textContent = `السؤال ${number}: ${item.question}`;
  div.appendChild(title);

  const choices = document.createElement("div");
  choices.className = "choices";

  ["صح", "خطأ"].forEach((answer) => {
    const label = document.createElement("label");
    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = `q${number}`;
    radio.value = answer;
    radio.required = true;

    label.appendChild(radio);
    label.appendChild(document.createTextNode(answer));
    choices.appendChild(label);
  });

  div.appendChild(choices);
  root.appendChild(div);
});

function formatDiscordMention(input) {
  const trimmed = (input || "").trim();
  const idMatch = trimmed.match(/\d{17,20}/);
  if (idMatch) {
    return {
      mention: `<@${idMatch[0]}>`,
      raw: trimmed,
      userId: idMatch[0]
    };
  }
  return {
    mention: trimmed,
    raw: trimmed,
    userId: null
  };
}

document.getElementById("quiz").addEventListener("submit", async function(event) {
  event.preventDefault();
  if (!this.reportValidity()) return;

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "جاري الإرسال...";

  const formData = new FormData(this);
  const gameUser = formData.get("gameUser").trim();
  const realName = formData.get("realName").trim();
  const age = formData.get("age").trim();
  const discordInput = formData.get("discordUser").trim();
  const discordInfo = formatDiscordMention(discordInput);

  let score = 0;
  const totalQuestions = quizData.length;

  const fields = [
    { name: "👤 الاسم الحقيقي", value: realName, inline: true },
    { name: "🎮 يوزر اللعبة", value: gameUser, inline: true },
    { name: "🎂 العمر", value: age, inline: true },
    { name: "💬 يوزر الديسكورد", value: discordInfo.mention, inline: false }
  ];

  quizData.forEach((item, index) => {
    const userAnswer = formData.get(`q${index + 1}`);
    const isCorrect = userAnswer === item.correct;
    if (isCorrect) score++;

    fields.push({
      name: `س${index + 1}: ${item.question}`,
      value: `**الإجابة:** ${userAnswer} ${isCorrect ? "✅" : "❌"}`,
      inline: false
    });
  });

  const isAccepted = score === totalQuestions;
  const statusText = isAccepted
    ? "🟢 مقبول تلقائياً (الدرجة كاملة 11/11)"
    : `🔴 مرفوض تلقائياً (الدرجة ${score}/${totalQuestions})`;

  const dmDecisionMessage = isAccepted
    ? `مبروك ${discordInfo.mention}، تم قبولك في الاختبار بنجاح (${score}/${totalQuestions}).`
    : `نعتذر ${discordInfo.mention}، لم يتم قبولك في الاختبار (${score}/${totalQuestions}). يمكنك المحاولة مرة أخرى لاحقاً.`;

  fields.push(
    { name: "📊 النتيجة", value: `**${score} / ${totalQuestions}**`, inline: true },
    { name: "📌 حالة التقديم", value: statusText, inline: true },
    { name: "✉️ رسالة الخاص التلقائية", value: dmDecisionMessage, inline: false }
  );

  const payload = {
    content: discordInfo.userId ? `<@${discordInfo.userId}>` : "",
    username: "نظام الاختبارات",
    embeds: [
      {
        title: "📋 نموذج اختبار إلكتروني جديد",
        color: isAccepted ? 3066993 : 15158332,
        fields: fields,
        timestamp: new Date().toISOString()
      }
    ]
  };

  try {
    const response = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      throw new Error("فشل الإرسال");
    }

    document.getElementById("quiz-view").style.display = "none";
    const confirmView = document.getElementById("confirmation-view");
    confirmView.style.display = "flex";

    document.getElementById("confirm-icon").textContent = isAccepted ? "🎉" : "❌";
    document.getElementById("confirm-title").textContent = isAccepted
      ? "مبروك! تم قبولك تلقائياً"
      : "نعتذر، لم يتم قبولك هذه المرة";
    document.getElementById("confirm-message").textContent = isAccepted
      ? "لقد أجبت على جميع الأسئلة بشكل صحيح وتم إرسال نتيجة قبولك إلى الإدارة."
      : "حصلت على أقل من 11 إجابة صحيحة، وتم إرسال نتيجة الاختبار إلى الإدارة.";
    document.getElementById("result-summary").textContent = `نتيجتك: ${score} من ${totalQuestions}`;

    window.scrollTo(0, 0);

  } catch (error) {
    alert("حدث خطأ أثناء إرسال الإجابات، تأكد من اتصال الإنترنت وحاول مرة أخرى.");
    btn.disabled = false;
    btn.textContent = "إرسال الإجابات";
  }
});
</script>
</body>
</html>
