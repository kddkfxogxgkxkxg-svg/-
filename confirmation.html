
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تم إرسال الاختبار</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#111326,#202544);color:#f5f6ff;font-family:Tahoma,Arial,sans-serif;text-align:center;padding:20px}
.card{width:min(500px,100%);background:#1b1e29;border:1px solid #34394b;border-top:4px solid #6b78ff;border-radius:20px;padding:35px 22px}
.icon{font-size:60px}
h1{font-size:27px}
p{font-size:18px;line-height:2}
.small{color:#b7bdd0;font-size:14px}
</style>
</head>
<body>
<div class="card">
<div class="icon">✅</div>
<h1>تم إرسال اختبارك إلى الإدارة</h1>
<p>يرجى الانتظار حتى يتم الرد عليك من الإدارة.</p>
<p class="small">شكرًا لك على إكمال الاختبار ❤️</p>
</div>
</body>
</html>
